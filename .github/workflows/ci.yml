name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR updates may discard superseded runs. Pushes to main must finish because
  # a later metadata-only push can otherwise cancel the only affected build
  # and then skip every project, leaving the resulting main HEAD unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      usermode: ${{ steps.detect.outputs.usermode }}
      setup: ${{ steps.detect.outputs.setup }}
      arklight: ${{ steps.detect.outputs.arklight }}
      ce_plugin: ${{ steps.detect.outputs.ce_plugin }}
      ce_launcher: ${{ steps.detect.outputs.ce_launcher }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Detect changed project inputs
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_changes.py --workflow ci.yml

  source-integrity:
    name: Source integrity
    needs: changes
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check changed-file whitespace
        shell: pwsh
        run: |
          # Captured tool output is exempt from source hygiene checks.
          #
          # docs/next/logs/ contains verbatim output from kd !analyze, acceptance test suites, and flight recorders.
          # Transcription. KD output inherently includes trailing whitespace, and the value of these files lies precisely in their 'exact match with the tool at that time'
          # Changing it to pass the check is equivalent to altering the evidence itself.
          $skipLogs = @(':(exclude)docs/next/logs/**')
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD" -- . @skipLogs
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $before = [string]$event.before
            $after = [string]$event.after
            $zeroCommit = '0' * 40

            if ($before -and $before -ne $zeroCommit) {
              git cat-file -e "$before^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                git fetch --no-tags --depth=1 origin $before
                git cat-file -e "$before^{commit}" 2>$null
              }
            }

            if ($before -and $before -ne $zeroCommit -and $LASTEXITCODE -eq 0) {
              git diff --check $before $after -- . @skipLogs
            }
            else {
              $commits = @($event.commits)
              $expectedCommitCount = $commits.Count
              if ($expectedCommitCount -le 0) {
                throw "Cannot prove the complete push range: before=$before and the push payload contains no commits."
              }
              if ($expectedCommitCount -ge 2048) {
                throw "Cannot prove the complete push range because GitHub caps the push payload at 2048 commits."
              }

              $firstCommit = [string]$commits[0].id
              git cat-file -e "$firstCommit^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "First pushed commit $firstCommit is unavailable."
              }
              $fallbackBase = (git rev-parse "$firstCommit^" 2>$null).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $fallbackBase) {
                throw "Parent of first pushed commit $firstCommit is unavailable."
              }
              git merge-base --is-ancestor $fallbackBase $after
              if ($LASTEXITCODE -ne 0) {
                throw "Push payload is not a complete ancestry range: $fallbackBase..$after."
              }

              $rangeCommitCount = [int](git rev-list --count "$fallbackBase..$after")
              if ($LASTEXITCODE -ne 0 -or $rangeCommitCount -ne $expectedCommitCount) {
                throw "Push payload is incomplete: payload commits=$expectedCommitCount, ancestry commits=$rangeCommitCount."
              }

              Write-Warning "Previous push commit is unavailable; checking all $expectedCommitCount commits from the push payload."
              git diff --check $fallbackBase $after -- . @skipLogs
            }
          }
          else {
            git diff --check HEAD~1 HEAD -- . @skipLogs
          }

      - name: Run portable source checks
        run: python tools/check.py

      # These arithmetic operations execute only after the driver is loaded; errors manifest as a BSOD or worse—silent modification is not an option.
      # EPT permissions for unrelated memory. After extracting into a shared header, correctness can be directly proven on the build machine.
      # Therefore, there is no reason to rely solely on manual execution by humans.
      - name: Run HVM control-arithmetic unit tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) {
            throw 'Could not locate the MSVC toolset through vswhere.'
          }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cmd /c "`"$vcvars`" >nul && cl /nologo /O2 /MT /W4 /WX tools\hvm_unit_tests\hvm_unit_tests.c /Fe:artifacts\hvm_unit_tests.exe /Fo:artifacts\ && artifacts\hvm_unit_tests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw 'HVM control-arithmetic unit tests failed.'
          }

      - name: Run contributor native tests (no Qt or WDK)
        run: python tools/dev.py test

      - name: Upload IOCTL audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ioctl-audit
          path: artifacts/ioctl-audit.md
          if-no-files-found: warn

  usermode-release:
    name: User-mode Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.usermode == 'true' && needs.source-integrity.result == 'success'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build supported user-mode Release targets
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          if (-not (Test-Path (Join-Path $env:KSWORD_QT_MSBUILD 'qt.targets'))) {
            throw "Qt MSBuild path is invalid: $env:KSWORD_QT_MSBUILD"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          # The release DynData pack is intentionally generated from the private,
          # reviewed PDB corpus and is not tracked in this source repository. The
          # The apps/launcher project consumes the v4 pack to generate its compile-time
          # support manifest. Keep empty CI-only v3/v4 fixtures because the real
          # packs come from the private, reviewed PDB corpus. They are never
          # copied to a release artifact or published.
          $ciProfiles = 'apps/desktop/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8
          @'
          {
            "packVersion": 4,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v4.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            '/m:1',
            '/v:minimal'
          )
          $projects = @(
            'apps/desktop/KswordDesktop.vcxproj',
            'apps/launcher/Launcher.vcxproj',
            'apps/taskbar/Taskbar.vcxproj',
            'apps/hud/KswordHUD.vcxproj',
            'integrations/api_monitor/APIMonitor_x64.vcxproj',
            'apps/cli/KswordCLI.vcxproj',
            'tests/native/fs_decode/KswordFsDecodeTests.vcxproj',
            'tests/native/monitor/KswordMonitorTests.vcxproj',
            'tests/native/dwm_z_order/OrderTests.vcxproj'
          )
          foreach ($project in $projects) {
            & $msbuild $project @properties
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $project with exit code $LASTEXITCODE."
            }
          }

          # Offline unit tests for file system structure decoding: feed only byte arrays, do not open volumes or load drivers.
          # runlist is untrusted input on disk; out-of-bounds and overflow branches are extremely difficult to construct on real volumes.
          $decodeTests = 'tests/native/fs_decode/x64/Release/KswordFsDecodeTests.exe'
          if (-not (Test-Path $decodeTests)) {
            throw "File-system decode tests were not built: $decodeTests"
          }
          & $decodeTests
          if ($LASTEXITCODE -ne 0) {
            throw "File-system decode tests failed with exit code $LASTEXITCODE."
          }

          # Loads the agent only in the test process; never injects into CI's DWM.
          & 'tests/native/dwm_z_order/x64/Release/DwmZOrderTests.exe' `
            (Join-Path $PWD 'artifacts/bin/x64/Release/KswordDwmZOrder.dll')
          if ($LASTEXITCODE -ne 0) {
            throw "DWM order model/agent protocol tests failed with exit code $LASTEXITCODE."
          }

      - name: Verify primary build artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'artifacts/bin/x64/Release/Ksword5.1.exe',
            'artifacts/bin/x64/Release/Launcher.exe',
            'artifacts/bin/x64/Release/Taskbar.exe',
            'artifacts/bin/x64/Release/KswordHUD.exe',
            'artifacts/bin/x64/Release/APIMonitor_x64.dll',
            'artifacts/bin/x64/Release/KswordDwmZOrder.dll',
            'artifacts/bin/x64/Release/KswordCLI.exe'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected Release artifact(s) missing: $($missing -join ', ')"
          }

      - name: Verify all CLI help routes
        run: python tools/test_cli_help.py --exe artifacts/bin/x64/Release/KswordCLI.exe

      - name: Verify ETW filter configuration
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:QT_ROOT_DIR 'bin') + ';' + $env:PATH
          & 'tests/native/monitor/x64/Release/KswordMonitorTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "ETW filter tests failed with exit code $LASTEXITCODE." }

      - name: Upload user-mode artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordUserMode-unsigned-Release
          path: |
            artifacts/bin/x64/Release/**
            !artifacts/bin/x64/Release/profiles/ark_dyndata_pack_v4.json.qz
            !artifacts/bin/x64/Release/profiles/launcher_support_manifest.json
          if-no-files-found: error

  ksword-setup:
    name: apps/setup Release build
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt for payload prerequisite
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build payload prerequisite and installer
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          # apps/setup embeds the Release payload generated by the main project.
          # The private profile corpus is not tracked, so provide the same
          # compile-only v3/v4 fixtures used by the regular user-mode CI.
          $ciProfiles = 'apps/desktop/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8
          @'
          {
            "packVersion": 4,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v4.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:SolutionDir=$((Resolve-Path '.').Path)\",
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            '/m:1',
            '/v:minimal'
          )
          & $msbuild 'apps/desktop/KswordDesktop.vcxproj' @properties
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for desktop payload prerequisite with exit code $LASTEXITCODE."
          }

          # Never embed compile-only empty DynData fixtures in an artifact that
          # can be promoted to a public automatic prerelease.
          $ciOnlyProfileOutputs = @(
            'artifacts/bin/x64/Release/profiles/ark_dyndata_pack_v4.json.qz',
            'artifacts/bin/x64/Release/profiles/launcher_support_manifest.json'
          )
          foreach ($profileOutput in $ciOnlyProfileOutputs) {
            if (Test-Path -LiteralPath $profileOutput) {
              Remove-Item -LiteralPath $profileOutput -Force
            }
          }

          & $msbuild 'apps/setup/KswordSetup.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for apps/setup with exit code $LASTEXITCODE."
          }

      - name: Verify apps/setup artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'artifacts/bin/x64/Release/KswordSetup.exe',
            'artifacts/bin/x64/Release/KswordSetup.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected apps/setup artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload apps/setup artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordSetup-unsigned-Release
          path: |
            artifacts/bin/x64/Release/KswordSetup.exe
            artifacts/bin/x64/Release/KswordSetup.pdb
          if-no-files-found: error

  ksword-arklight:
    name: apps/ark_light Release build
    needs: changes
    if: needs.changes.outputs.arklight == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build driver prerequisite and apps/ark_light
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          $solutionDir = (Resolve-Path '.').Path + '\'
          & $msbuild 'drivers/ark/KswordARKDriver.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /p:KswordArkSkipAutoVariantSign=true `
            /p:KswordArkSkipAutoTestSign=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for drivers/ark prerequisite with exit code $LASTEXITCODE."
          }

          & $msbuild 'apps/ark_light/KswordARKLight.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:KswordArkLightEnsureDriverBuilt=false `
            /p:KswordArkLightSkipDriverSign=true `
            /p:KswordArkLightReuseSignedDriver=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for apps/ark_light with exit code $LASTEXITCODE."
          }

          & $msbuild 'tests/native/ark_light/KswordARKLightTests.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKLightTests with exit code $LASTEXITCODE."
          }

          & 'tests/native/ark_light/x64/Release/KswordARKLightTests.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "KswordARKLightTests failed with exit code $LASTEXITCODE."
          }

      - name: Verify apps/ark_light artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'artifacts/bin/x64/Release/KswordARKLight.exe',
            'apps/ark_light/generated/KswordARK.sys'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected apps/ark_light artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload apps/ark_light artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordARKLight-unsigned-Release
          path: |
            artifacts/bin/x64/Release/KswordARKLight.exe
            apps/ark_light/generated/KswordARK.sys
          if-no-files-found: error

  ksword-ce-plugin:
    name: KswordCheatEnginePlugin Release build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.ce_plugin == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build KswordCheatEnginePlugin
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'integrations/cheat_engine_plugin/KswordCheatEnginePlugin.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform='${{ matrix.platform }}' `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordCheatEnginePlugin (${{ matrix.platform }}) with exit code $LASTEXITCODE."
          }

      - name: Verify KswordCheatEnginePlugin artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'integrations/cheat_engine_plugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.dll',
            'integrations/cheat_engine_plugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordCheatEnginePlugin artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordCheatEnginePlugin artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordCheatEnginePlugin-${{ matrix.platform }}-Release
          path: |
            integrations/cheat_engine_plugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.dll
            integrations/cheat_engine_plugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.pdb
          if-no-files-found: error

  ksword-ce-launcher:
    name: KswordCheatEngineLauncher Release build
    needs: changes
    if: needs.changes.outputs.ce_launcher == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build KswordCheatEngineLauncher
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'integrations/cheat_engine_launcher/KswordCheatEngineLauncher.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordCheatEngineLauncher with exit code $LASTEXITCODE."
          }

      - name: Verify KswordCheatEngineLauncher artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'integrations/cheat_engine_launcher/x64/Release/KswordCheatEngineLauncher.exe',
            'integrations/cheat_engine_launcher/x64/Release/KswordCheatEngineLauncher.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordCheatEngineLauncher artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordCheatEngineLauncher artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordCheatEngineLauncher-Release
          path: |
            integrations/cheat_engine_launcher/x64/Release/KswordCheatEngineLauncher.exe
            integrations/cheat_engine_launcher/x64/Release/KswordCheatEngineLauncher.pdb
          if-no-files-found: error

  auto-prerelease:
    name: Publish automatic prerelease
    needs:
      - changes
      - source-integrity
      - usermode-release
      - ksword-setup
      - ksword-arklight
      - ksword-ce-plugin
      - ksword-ce-launcher
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.source-integrity.result == 'success' || needs.source-integrity.result == 'skipped') &&
      (needs.usermode-release.result == 'success' || needs.usermode-release.result == 'skipped') &&
      (needs.ksword-setup.result == 'success' || needs.ksword-setup.result == 'skipped') &&
      (needs.ksword-arklight.result == 'success' || needs.ksword-arklight.result == 'skipped') &&
      (needs.ksword-ce-plugin.result == 'success' || needs.ksword-ce-plugin.result == 'skipped') &&
      (needs.ksword-ce-launcher.result == 'success' || needs.ksword-ce-launcher.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release automation
        uses: actions/checkout@v5

      - name: Publish prerelease and retain the latest three
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_USERMODE_REQUIRED: ${{ needs.changes.outputs.usermode }}
          CURRENT_SETUP_REQUIRED: ${{ needs.changes.outputs.setup }}
          CURRENT_ARKLIGHT_REQUIRED: ${{ needs.changes.outputs.arklight }}
          CURRENT_CE_PLUGIN_REQUIRED: ${{ needs.changes.outputs.ce_plugin }}
          CURRENT_CE_LAUNCHER_REQUIRED: ${{ needs.changes.outputs.ce_launcher }}
        run: bash .github/workflows/scripts/publish-ci-prerelease.sh
