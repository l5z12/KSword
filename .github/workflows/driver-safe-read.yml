name: Driver Safe Read Audit

on:
  push:
    paths:
      - 'drivers/ark/**'
      - '.github/workflows/driver-safe-read.yml'
  pull_request:
    paths:
      - 'drivers/ark/**'
      - '.github/workflows/driver-safe-read.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit crash-safe kernel reads
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify fault-contained readers
        shell: pwsh
        run: ./drivers/ark/tests/SafeReadRegression.ps1
