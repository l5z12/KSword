name: Driver Functional Matrix

# Two-stage:
# - plan-gate runs on a standard Windows runner to ensure the functional matrix plan stays synchronized with the IOCTL registry,
#   Also verify the harness's safety logic. The build must pass even without a driver test machine.
# - functional-matrix runs only on dedicated self-hosted machines with test signatures enabled, actually loading the driver,
#   Traverse functions and treat system crashes as failures.

on:
  push:
    paths:
      - 'shared/driver/**'
      - 'drivers/ark/src/dispatch/**'
      - 'drivers/ark/tests/DriverFunctionalMatrix.ps1'
      - 'apps/cli/**'
      - 'tools/driver_functional_ci/**'
      - 'tools/cli_catalog.py'
      - '.github/workflows/driver-functional-ci.yml'
  pull_request:
    paths:
      - 'shared/driver/**'
      - 'drivers/ark/src/dispatch/**'
      - 'drivers/ark/tests/DriverFunctionalMatrix.ps1'
      - 'apps/cli/**'
      - 'tools/driver_functional_ci/**'
      - 'tools/cli_catalog.py'
      - '.github/workflows/driver-functional-ci.yml'
  workflow_dispatch:
    inputs:
      include_guarded:
        description: 'Run guarded cases (private EPROCESS writes, global rules, etc.). Crash attribution is downgraded to harness-attributable.'
        type: boolean
        default: false
      case_filter:
        description: 'Run cases whose IDs match this regex; leave empty to run all cases.'
        type: string
        default: ''
      acknowledge_previous_crash:
        description: 'Acknowledge that the previous crash has been investigated and unblock this run.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The driver test machine is an exclusive resource; only one driver load cycle is allowed at a time.
  group: driver-functional-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-gate:
    name: Functional plan gate
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate functional matrix plan
        run: >-
          python tools/driver_functional_ci/plan_gate.py
          --repo-root .
          --out artifacts/driver-functional-plan.md

      - name: Self-test the matrix harness
        shell: pwsh
        run: ./drivers/ark/tests/DriverFunctionalMatrix.ps1 -Mode SelfTest

      - name: Upload plan coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: driver-functional-plan
          path: artifacts/driver-functional-plan.md
          if-no-files-found: warn

  functional-matrix:
    name: Driver functional matrix (test-signing runner)
    needs: plan-gate
    # Queue only when the repository variable declaring a driver test runner exists; otherwise, the job will hang indefinitely waiting for a runner.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.KSWORD_DRIVER_TESTMODE_RUNNER == 'true' }}
    runs-on: [self-hosted, windows, x64, ksword-driver-testmode]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Confirm the runner is a driver test machine
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The runner must run as administrator to load the kernel driver and read crash evidence.'
          }
          $bcd = & bcdedit.exe /enum '{current}' | Out-String
          if ($bcd -notmatch '(?im)^\s*testsigning\s+Yes\s*$') {
            throw 'Test signing is disabled. Run bcdedit /set testsigning on and reboot before adding the ksword-driver-testmode label.'
          }
          Write-Host 'Test signing is enabled.'

      - name: Build driver and apps/cli
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'drivers/ark/KswordARKDriver.vcxproj' `
            /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:KswordArkSkipAutoVariantSign=true `
            /p:KswordArkSkipAutoTestSign=true `
            /m:1 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Driver MSBuild failed with exit code $LASTEXITCODE." }
          & $msbuild 'apps/cli/KswordCLI.vcxproj' `
            /t:Build /p:Configuration=Release /p:Platform=x64 /m:1 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "apps/cli MSBuild failed with exit code $LASTEXITCODE." }

      - name: Test-sign the driver
        shell: pwsh
        run: >-
          ./scripts/Sign-KswordArkDriverTest.ps1
          -DriverPath 'artifacts/bin/x64/Release/KswordARK.sys'

      - name: Collect the previous run journal
        shell: pwsh
        run: |
          # If the machine crashed in the previous run, the logs before this checkout are the only record of the scene.
          $state = Join-Path $env:ProgramData 'KswordARK\driver-functional-ci'
          $target = 'artifacts/driver-functional-ci'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('journal.jsonl', 'last-run.json')) {
            $source = Join-Path $state $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $target "previous-$name") -Force
            }
          }

      - name: Run the driver functional matrix
        id: matrix
        shell: pwsh
        run: |
          $arguments = @('-Mode', 'Run', '-ConfigureCrashDump')
          if ('${{ inputs.include_guarded }}' -eq 'true') {
            $arguments += @('-IncludeGuarded', '-AcknowledgeGuardedRisk')
          }
          if ('${{ inputs.acknowledge_previous_crash }}' -eq 'true') {
            $arguments += '-AcknowledgePreviousCrash'
          }
          $filter = '${{ inputs.case_filter }}'
          if (-not [string]::IsNullOrWhiteSpace($filter)) {
            $arguments += @('-CaseFilter', $filter)
          }
          # Invoke via a separate process so the exit code is not swallowed by the outer pwsh script scope.
          & pwsh -NoProfile -File ./drivers/ark/tests/DriverFunctionalMatrix.ps1 @arguments
          $code = $LASTEXITCODE
          "exitCode=$code" >> $env:GITHUB_OUTPUT
          switch ($code) {
            0 { Write-Host 'All driver functional matrix cases passed; no system crash was observed.'; break }
            2 { throw 'The system crashed during the functional matrix. See attribution in the verdict file; driver-defect means a planned safe operation crashed the machine.' }
            3 { throw 'Preflight failed: follow the diagnostics above for test signing, administrator privileges, kernel dumps, or an unresolved previous crash.' }
            default { throw "The driver functional matrix contains failed cases (exit code $code)." }
          }

      - name: Collect this run journal
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:ProgramData 'KswordARK\driver-functional-ci\journal.jsonl'
          $target = 'artifacts/driver-functional-ci'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          if (Test-Path -LiteralPath $source) {
            Copy-Item -LiteralPath $source -Destination (Join-Path $target 'journal.jsonl') -Force
          }

      - name: Summarize the verdict
        if: always()
        shell: pwsh
        run: |
          $verdictPath = 'artifacts/driver-functional-ci/verdict.json'
          if (-not (Test-Path -LiteralPath $verdictPath)) {
            'The matrix produced no verdict file; inspect the previous step logs.' | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
            return
          }
          $verdict = Get-Content -LiteralPath $verdictPath -Raw | ConvertFrom-Json
          $lines = @(
            '## Driver functional matrix',
            '',
            "- Verdict: ``$($verdict.verdict)``",
            "- Crash attribution: ``$($verdict.attribution)``",
            "- Attribution weakened by guarded cases: $($verdict.attributionWeakened)",
            "- Cases: passed $($verdict.counts.passed) / failed $($verdict.counts.failed) / skipped $($verdict.counts.skipped)",
            ''
          )
          if ($verdict.crash.crashed) {
            $lines += @('### Crash evidence', '', "- New dumps: $($verdict.crash.newDumps.Count)",
                        "- Unexpected reboot: $($verdict.crash.unexpectedBoot)",
                        "- Related events: $($verdict.crash.events.Count)", '')
          }
          $failed = @($verdict.results | Where-Object { $_.status -eq 'failed' })
          if ($failed.Count -gt 0) {
            $lines += @('### Failed cases', '', '| Case | Tier | Reason |', '| --- | --- | --- |')
            foreach ($item in $failed) { $lines += "| $($item.case) | $($item.tier) | $($item.reason) |" }
            $lines += ''
          }
          $lines -join "`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: driver-functional-matrix
          path: artifacts/driver-functional-ci/**
          if-no-files-found: warn
